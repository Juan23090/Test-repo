<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify your email address for EMA</title>
</head>
<body style="margin: 0; padding: 0; background: #f3f4f6; font-family: Arial, Helvetica, sans-serif; color: #1f2933; line-height: 1.5;">
    <div style="max-width: 520px; margin: 0 auto; padding: 24px;">
        <div style="padding: 24px; background: #ffffff; border: 1px solid #d1d5db;">
            <h2 style="margin: 0 0 16px;">Verify your email address</h2>
            <p>Use the following 6-digit code to verify this email address:</p>
            <div style="font-size: 28px; font-weight: 700; letter-spacing: 6px; padding: 16px 20px; background: #f3f4f6; border-radius: 8px; text-align: center;">{{Code}}</div>
            <p style="margin-top: 20px;">This code will expire in 5 minutes.</p>
            <p style="font-size: 13px; color: #6b7280;">If you did not request this code, you can ignore this email.</p>
        </div>
    </div>
</body>
</html>
